<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGRO TEAM</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app">

        <!-- CONFIGURAÇÕES -->
        <section id="configuracoes">
            <h2>Configurações</h2>

            <input id="conf-comercial" type="number" placeholder="Comercial">
            <input id="conf-atleta" type="number" placeholder="Atleta">
            <input id="conf-particular" type="number" placeholder="Particular">
            <input id="conf-instrutor" type="number" placeholder="Instrutor">
            <input id="conf-bolsista" type="number" placeholder="Bolsista">

            <select id="conf-ct-sel"></select>

            <input id="conf-ct-comercial" type="number" placeholder="Comercial CT">
            <input id="conf-ct-atleta" type="number" placeholder="Atleta CT">
            <input id="conf-ct-particular" type="number" placeholder="Particular CT">
            <input id="conf-ct-instrutor" type="number" placeholder="Instrutor CT">
            <input id="conf-ct-bolsista" type="number" placeholder="Bolsista CT">

            <button onclick="salvarPrecoCT()">Salvar Preços CT</button>

            <div id="timeline-auditoria"></div>
        </section>


        <!-- CAMPEONATOS -->
        <section>
            <h2>Campeonatos</h2>

            <select id="camp-atleta"></select>

            <div id="camp-lista"></div>
            <div id="aut-lista"></div>
        </section>


        <!-- PAGAMENTOS -->
        <section>
            <h2>Pagamentos</h2>

            <input id="pag-filtro-nome" placeholder="Buscar aluno">

            <select id="pag-filtro-ct"></select>

            <input id="pag-filtro-de" type="date">
            <input id="pag-filtro-ate" type="date">

            <input id="pag-filtro-val-min" type="number" placeholder="Valor mínimo">
            <input id="pag-filtro-val-max" type="number" placeholder="Valor máximo">

            <div>
                Total filtro: <span id="pag-total-filtro"></span>
            </div>

            <div>
                Total geral: <span id="pag-total-geral"></span>
            </div>

            <div>
                Quantidade: <span id="pag-count"></span>
            </div>

            <div id="pag-lista"></div>

            <button onclick="abrirFormPagamento('Pix')">Novo PIX</button>
            <button onclick="abrirFormPagamento('Dinheiro')">Novo Dinheiro</button>

            <div id="form-novo-pagamento" style="display:none">

                <select id="pag-aluno-sel"></select>
                <select id="pag-ct-sel"></select>

                <input id="pag-valor" type="number" step="0.01">
                <input id="pag-data" type="date">

                <input id="pag-metodo" type="hidden">

                <button onclick="registrarPagamento()">
                    Registrar
                </button>
            </div>
        </section>


        <!-- MODAL -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="modal-title"></h3>
                <p id="modal-message"></p>
                <button onclick="fecharModal()">Fechar</button>
            </div>
        </div>

    </div>

    <script type="module" src="js/firebase.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
