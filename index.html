<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGRO TEAM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

  <header class="brand-header">
    <h1>OGRO TEAM</h1>
    <p>Sistema de Gestão</p>
  </header>

  <section class="page active">

    <h2>Configurações</h2>

    <div class="form-grid">
      <input id="conf-comercial" type="number" placeholder="Comercial">
      <input id="conf-atleta" type="number" placeholder="Atleta">
      <input id="conf-particular" type="number" placeholder="Particular">
      <input id="conf-instrutor" type="number" placeholder="Instrutor">
      <input id="conf-bolsista" type="number" placeholder="Bolsista">
    </div>

    <h3>Preços por CT</h3>

    <select id="conf-ct-sel" onchange="carregarPrecoCT()"></select>

    <div class="form-grid mt">
      <input id="conf-ct-comercial" type="number" placeholder="Comercial CT">
      <input id="conf-ct-atleta" type="number" placeholder="Atleta CT">
      <input id="conf-ct-particular" type="number" placeholder="Particular CT">
      <input id="conf-ct-instrutor" type="number" placeholder="Instrutor CT">
      <input id="conf-ct-bolsista" type="number" placeholder="Bolsista CT">
    </div>

    <button class="btn btn-primary" onclick="salvarPrecoCT()">
      Salvar Preços CT
    </button>

    <h2>Campeonatos</h2>

    <select id="camp-atleta" onchange="carregarAtleta()"></select>

    <div class="list-container" id="camp-lista"></div>

    <h2>Pagamentos</h2>

    <input id="pag-filtro-nome" class="input-busca" type="text" placeholder="Buscar aluno" onkeyup="renderPagamentos()">

    <div class="metricas">
      <div>
        <span>Total filtro</span>
        <strong id="pag-total-filtro">R$ 0,00</strong>
      </div>

      <div>
        <span>Total geral</span>
        <strong id="pag-total-geral">R$ 0,00</strong>
      </div>

      <div>
        <span>Quantidade</span>
        <strong id="pag-count">0</strong>
      </div>
    </div>

    <div class="actions-row">
      <button class="btn btn-verde" onclick="abrirFormPagamento('Pix')">
        Novo PIX
      </button>

      <button class="btn btn-primary" onclick="abrirFormPagamento('Dinheiro')">
        Novo Dinheiro
      </button>
    </div>

    <div id="form-novo-pagamento" class="hidden-box">

      <select id="pag-aluno-sel"></select>

      <select id="pag-ct-sel"></select>

      <input id="pag-valor" type="number" placeholder="Valor">

      <input id="pag-data" type="date">

      <input id="pag-metodo" type="hidden">

      <button class="btn btn-primary" onclick="registrarPagamento()">
        Registrar
      </button>

    </div>

    <div class="list-container" id="pag-lista"></div>

    <h2>Auditoria</h2>

    <div class="timeline" id="timeline-auditoria"></div>

  </section>

</div>

<script src="script.js"></script>
</body>
</html>
